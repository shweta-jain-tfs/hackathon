name: Formatted Copilot report

on:
  pull_request_review:
    types: [submitted]

  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to format
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: formatted-copilot-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Read historical patterns and publish formatted report
        uses: actions/github-script@v8
        env:
          MANUAL_PR: ${{ inputs.pr_number }}
        with:
          script: |
            const { owner, repo } = context.repo;

            const pr = Number(
              context.payload.pull_request?.number ||
              process.env.MANUAL_PR
            );

            if (!Number.isSafeInteger(pr) || pr <= 0) {
              throw new Error('Enter a valid pull request number.');
            }

            // Find the latest submitted Copilot review.
            const bot = 'copilot-pull-request-reviewer[bot]';

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner,
                repo,
                pull_number: pr,
                per_page: 100
              }
            );

            const review = reviews
              .filter(r =>
                r.user?.login === bot &&
                r.submitted_at &&
                r.state !== 'PENDING'
              )
              .sort((a, b) =>
                Date.parse(b.submitted_at) - Date.parse(a.submitted_at) ||
                b.id - a.id
              )[0];

            if (!review) {
              throw new Error(
                'No submitted Copilot review exists on this PR. ' +
                'Request a Copilot review first, then run this workflow.'
              );
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr
            });

            const comments = await github.paginate(
              github.rest.pulls.listCommentsForReview,
              {
                owner,
                repo,
                pull_number: pr,
                review_id: review.id,
                per_page: 100
              }
            );

            // Read historical patterns from the reviewed commit.
            const patternsPath =
              '.github/skills/code-review/references/pr-comment-patterns.md';

            const patternsRef = review.commit_id;

            let patternsFile;

            try {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: patternsPath,
                ref: patternsRef
              });

              patternsFile = response.data;
            } catch (error) {
              if (error.status === 404) {
                throw new Error(
                  `${patternsPath} was not found at reviewed commit ` +
                  `${patternsRef}. Ensure the file exists in the PR, ` +
                  'request a new Copilot review, and rerun this workflow.'
                );
              }

              throw error;
            }

            if (
              Array.isArray(patternsFile) ||
              patternsFile.type !== 'file' ||
              patternsFile.encoding !== 'base64' ||
              typeof patternsFile.content !== 'string'
            ) {
              throw new Error(
                'The historical review patterns could not be read ' +
                'as a Base64-encoded file.'
              );
            }

            const patterns = Buffer.from(
              patternsFile.content,
              'base64'
            ).toString('utf8').trim();

            if (!patterns) {
              throw new Error('The historical review patterns file is empty.');
            }

            // Keep the report within GitHub comment size limits.
            // The full file remains available through the source link.
            const patternsLimit = 12000;

            const displayedPatterns = patterns.length > patternsLimit
              ? patterns.slice(0, patternsLimit) +
                '\n\nReference excerpt truncated. Read the linked source for the full file.'
              : patterns;

            const patternsUrl =
              `https://github.com/${owner}/${repo}/blob/` +
              `${patternsRef}/${patternsPath}`;

            core.notice(
              `Read historical patterns: ${patternsPath}; ` +
              `commit=${patternsRef}; blob=${patternsFile.sha}`
            );

            const pastPrComments = [
              '**Status: Reference loaded.**',
              `[Source: pr-comment-patterns.md](${patternsUrl})`,
              `Reference commit: \`${patternsRef}\``,
              'The historical expectations below were read by this formatter. ' +
                'Their applicability to this PR has not been independently assessed. ' +
                'This does not establish whether the original Copilot review used them.',
              '<details>\n<summary>Historical reviewer expectations</summary>',
              displayedPatterns,
              '</details>'
            ].join('\n\n');

            // Preserve the original published Copilot comments.
            let findings = comments.length
              ? comments.map((c, i) => {
                  const line =
                    c.line ?? c.original_line ?? 'line unavailable';

                  const location = `${c.path}:${line}`;
                  const excerpt = (c.body || '').slice(0, 2500);

                  return [
                    `### Published comment ${i + 1}`,
                    `[${location}](${c.html_url})`,
                    excerpt
                      .split('\n')
                      .map(text => '> ' + text)
                      .join('\n'),
                    c.body?.length > 2500
                      ? 'Full text is available at the source link.'
                      : ''
                  ].filter(Boolean).join('\n\n');
                }).join('\n\n')
              : 'No inline comments were published in this review. ' +
                'This does not establish a clean review.';

            if (findings.length > 35000) {
              findings = findings.slice(0, 35000) +
                '\n\nPublished findings truncated. ' +
                'Read the linked original review for all comments.';
            }

            const stale = review.commit_id !== pull.head.sha
              ? '**Earlier revision:** this review does not cover the current PR head.'
              : '';

            // Keep this marker unchanged to update the existing report.
            const marker = '<!-- formatted-copilot-report:v1 -->';

            const body = [
              marker,
              '# Formatted Copilot review report',
              `PR #${pr} | Reviewed commit: \`${review.commit_id}\` | ` +
                `[Original review](${review.html_url})`,
              'This report collects published Copilot comments and displays ' +
                'the historical review reference. It does not run another review.',
              stale,
              '## 1. Application practices',
              '**Status: Unverified.** Published output does not establish ' +
                'full application-practices coverage. See the source findings below.',
              '## 2. Coding practices',
              '**Status: Unverified.** No independent standards assessment ' +
                'was performed by this formatter.',
              '## 3. Risk',
              '**Status: Partial — published findings collected.** ' +
                'Comments are reproduced without independently validating ' +
                'or classifying them. Their original priorities and wording are preserved.',
              findings,
              '## 4. Past PR comments',
              pastPrComments,
              '## Coverage and checks',
              [
                '| Evidence pass | Status | Evidence and limitations |',
                '| --- | --- | --- |',
                '| Standards/project patterns | Unverified | Published comments only; no independent source or standards checks |',
                '| Historical PR feedback | Reference loaded | Markdown read at the reviewed commit; application to this PR not assessed |'
              ].join('\n'),
              'No builds, tests, or browser checks were run by this formatter.'
            ].filter(Boolean).join('\n\n');

            if (body.length > 60000) {
              throw new Error(
                'The report exceeds the comment size budget. ' +
                'Reduce the reference or findings excerpt limits.'
              );
            }

            const existing = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: pr,
                per_page: 100
              }
            );

            const previous = existing.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              c.body?.startsWith(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });

              core.notice(`Updated formatted report: ${previous.html_url}`);
            } else {
              const { data } = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr,
                body
              });

              core.notice(`Published formatted report: ${data.html_url}`);
            }
